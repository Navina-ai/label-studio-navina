name: Push Label Studio Navina image to ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 153975004783.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: label_studio_navina
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${IMAGE_NAME}" --region "${AWS_REGION}" \
            || aws ecr create-repository --repository-name "${IMAGE_NAME}" --region "${AWS_REGION}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
